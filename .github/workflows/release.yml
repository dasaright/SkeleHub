name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = (python -c 'from version import VERSION; print(VERSION)').Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION in version.py' }
      - name: Install AutoIt
        shell: pwsh
        run: |
          choco install autoit --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'AutoIt installation failed' }
      - name: Check and build
        shell: pwsh
        run: .\Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SkeleHub-Windows
          path: SkeleHub-*-windows.zip
          if-no-files-found: error
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (python -c 'from version import VERSION; print(VERSION)').Trim()
          $tag = "v$version"
          $asset = (Get-ChildItem "SkeleHub-$version-windows.zip" | Select-Object -First 1).FullName
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving its files unchanged."
          } else {
            gh release create $tag $asset --target $env:GITHUB_SHA --latest --title "SkeleHub $tag" --notes "Windows test build. See README for setup and supervised game testing."
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
      - name: Verify public updater download
        shell: pwsh
        run: |
          @'
          import tempfile, time
          from updater import check_release, stage_release
          from version import VERSION
          for attempt in range(6):
              try:
                  release = check_release('0.0.0')
                  assert release and release['version'] == VERSION, 'Latest release does not match build'
                  with tempfile.TemporaryDirectory() as data:
                      stage_release(release, data)
                  print('Public release lookup, download, checksum and package validation passed.')
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(3)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Public updater download verification failed' }
